name: Postman API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  postman:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habit_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build API image
        run: docker build -t habit-api .

      - name: Run API container
        run: |
          docker run -d -p 5093:8080 --name habit-api \
            -e "ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=habit_tracker_test;Username=postgres;Password=postgres" \
            -e "Redis__ConnectionString=localhost:6379" \
            habit-api

      - name: Wait for API to be ready
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:5093/health; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/20)"
            sleep 2
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman setup tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-setup-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment.json \
            --reporters junit \
            --reporter-junit-export setup-report.xml

      - name: Run Postman main tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-main-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment.json \
            --reporters junit \
            --reporter-junit-export main-report.xml

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-reports
          path: |
            setup-report.xml
            main-report.xml