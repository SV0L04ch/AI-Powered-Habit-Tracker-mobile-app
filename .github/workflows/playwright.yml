name: Playwright Tests

on:
  push:
    branches: [ main, feature/github-actions-integration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  playwright:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << EOF > backend/HabitApi/.env
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          EOF

      - name: Start dependencies
        run: |
          docker compose \
            -f backend/HabitApi/docker-compose.ci.yml \
            up -d db redis mailhog

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker exec habit_tracker_db pg_isready -U habit_user -d habit_tracker; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 2
          done

          docker logs habit_tracker_db
          exit 1

      - name: Build API SDK image
        run: |
          docker build \
            --target build \
            -t habit-api-sdk \
            -f backend/HabitApi/Dockerfile \
            backend/HabitApi

      - name: Apply migrations
        run: |
          docker run --rm \
            --network container:habit_tracker_db \
            -e ConnectionStrings__DefaultConnection="Host=127.0.0.1;Port=5432;Database=habit_tracker;Username=habit_user;Password=${{ secrets.DB_PASSWORD }}" \
            habit-api-sdk \
            sh -c "
              dotnet ef database update \
              --project /src/HabitApi.csproj
            "

      - name: Start all services
        run: |
          docker compose \
            -f backend/HabitApi/docker-compose.ci.yml \
            up -d

      - name: Wait for API healthcheck
        run: |
          for i in {1..90}; do
            if curl -fs http://localhost:5093/health; then
              echo "API ready"
              exit 0
            fi

            sleep 2
          done

          echo "========= API LOGS ========="
          docker logs habit_tracker_api

          echo "========= COMPOSE ========="
          docker compose -f backend/HabitApi/docker-compose.ci.yml ps

          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Start frontend
        run: |
          cd frontend
          npm ci
          npm run dev -- --host 0.0.0.0 &
          
      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:5173; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done

          echo "Frontend failed to start"
          exit 1

      - name: Verify Playwright package
        run: npm ls @playwright/test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: true
        run: |
          npx playwright test \
            --config=playwright.config.cjs \
            --project=${{ matrix.project }} \
            --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Stop containers
        if: always()
        run: |
          docker compose \
            -f backend/HabitApi/docker-compose.ci.yml \
            down -v