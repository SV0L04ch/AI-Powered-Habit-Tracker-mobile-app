name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  playwright:
    strategy:
      matrix:
        project: [chromium, firefox, webkit, 'iPhone 12', 'Pixel 5']
      max-parallel: 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          cat << EOF > backend/HabitApi/.env
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          EOF

      - name: Start dependencies (DB, Redis, Mailhog)
        run: docker-compose -f backend/HabitApi/docker-compose.ci.yml up -d db redis mailhog

      - name: Wait for DB to be ready
        run: |
          for i in {1..30}; do
            if docker exec habit_tracker_db pg_isready -U habit_user -d habit_tracker; then
              echo "DB ready"
              break
            fi
            sleep 2
          done

      - name: Build SDK image for migrations
        run: docker build --target build -t habit-api-sdk .

      - name: Add and apply migrations
        run: |
          docker run --rm \
            --network container:habit_tracker_db \
            -e ConnectionStrings__DefaultConnection="Host=db;Port=5432;Database=habit_tracker;Username=habit_user;Password=${{ secrets.DB_PASSWORD }}" \
            habit-api-sdk \
            sh -c "dotnet ef migrations add InitialCreate --no-build 2>/dev/null || true && dotnet ef database update --no-build"

      - name: Start all services (API, mock)
        run: docker-compose -f backend/HabitApi/docker-compose.ci.yml up -d

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5093/health; then
              echo "API ready"
              break
            fi
            sleep 2
          done

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --workers=1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker-compose -f backend/HabitApi/docker-compose.ci.yml down