name: Postman API Tests

on:
  push:
    branches: [ main, feature/github-actions-integration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  postman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << EOF > backend/HabitApi/.env
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          EOF

      - name: Start dependencies
        run: docker compose -f backend/HabitApi/docker-compose.ci.yml up -d db redis mailhog

      - name: Wait for DB
        run: |
          for i in {1..30}; do
            if docker exec habit_tracker_db pg_isready -U habit_user -d habit_tracker; then
              echo "DB ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build SDK image
        run: docker build --target build -t habit-api-sdk -f backend/HabitApi/Dockerfile backend/HabitApi

      - name: Apply migrations
        run: |
          docker run --rm \
            --network container:habit_tracker_db \
            -e ConnectionStrings__DefaultConnection="Host=127.0.0.1;Port=5432;Database=habit_tracker;Username=habit_user;Password=${{ secrets.DB_PASSWORD }}" \
            habit-api-sdk \
            sh -c "dotnet ef database update --project /src/HabitApi.csproj"

      - name: Start API
        run: docker compose -f backend/HabitApi/docker-compose.ci.yml up -d

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:5093/health; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          docker logs habit_tracker_api
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Newman
        run: npm install -g newman

      - name: Run setup tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-setup-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment.json \
            --export-environment postman/AI-Powered-Habit-Tracker-Environment-output.json

      - name: Run main tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-main-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment-output.json

      - name: Stop services
        if: always()
        run: docker compose -f backend/HabitApi/docker-compose.ci.yml down -v