name: Postman API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  postman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          cat << EOF > backend/HabitApi/.env
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          EOF

      - name: Start all services (CI version)
        run: docker-compose -f backend/HabitApi/docker-compose.ci.yml up -d

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5093/health; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Reset database
        run: |
          docker exec habit_tracker_db psql -U habit_user -d habit_tracker -c 'TRUNCATE TABLE "Users", "Habits", "HabitEntries" CASCADE;'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman setup tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-setup-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment.json \
            --export-environment postman/AI-Powered-Habit-Tracker-Environment.json

      - name: Run Postman main tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-main-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment.json

      - name: Stop services
        if: always()
        run: docker-compose -f backend/HabitApi/docker-compose.ci.yml down