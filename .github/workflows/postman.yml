name: Postman API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  postman:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start all services (API, PostgreSQL, Redis) with Docker Compose
        run: docker compose up -d

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5093/health; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Reset database
        run: |
          # Ждём готовности PostgreSQL
          for i in {1..10}; do
            if docker exec habit_tracker_db pg_isready -U habit_user -d habit_tracker; then
              break
            fi
            echo "Waiting for DB..."
            sleep 2
          done
          # Очищаем таблицы
          docker exec habit_tracker_db psql -U habit_user -d habit_tracker -c 'TRUNCATE TABLE "Users", "Habits", "HabitEntries" CASCADE;'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman setup tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-setup-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment.json \
            --export-environment postman/AI-Powered-Habit-Tracker-Environment.json

      - name: Run Postman main tests
        run: |
          newman run postman/AI-Powered-Habit-Tracker-main-tests.json \
            -e postman/AI-Powered-Habit-Tracker-Environment.json