version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: habit_tracker_db
    environment:
      POSTGRES_USER: habit_user
      POSTGRES_PASSWORD: $vagaBober[228]
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_user -d habit_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: habit_api
    ports:
      - "5093:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=habit_tracker;Username=habit_user;Password=$vagaBober[228]
    restart: unless-stopped

volumes:
  postgres_data: