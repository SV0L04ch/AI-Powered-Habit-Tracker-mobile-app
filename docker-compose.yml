services:
  db:
    image: postgres:15-alpine
    container_name: habit_tracker_db
    environment:
      POSTGRES_USER: habit_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_user -d habit_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: habit_api
    ports:
      - "5093:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Переменные для подключения к БД (используются в Program.cs)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=habit_tracker
      - DB_USER=habit_user
      - DB_PASSWORD=${DB_PASSWORD}
      # JWT секрет
      - JWT_SECRET=${JWT_SECRET}
      # API погоды
      - WEATHER_BASE_URL=${WEATHER_BASE_URL:-https://api.openweathermap.org/data/2.5/}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      # AI API
      - AI_BASE_URL=${AI_BASE_URL:-https://api.groq.com/openai/v1}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-llama3-8b-8192}
    restart: unless-stopped

volumes:
  postgres_data:
